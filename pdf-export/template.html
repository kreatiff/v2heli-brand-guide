<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>V2 Helicopters | Brand Guidelines (Print)</title>
<style>
/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
img, svg { max-width: 100%; display: block; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, h4, p { margin: 0; }
svg symbol { overflow: visible; }

/* ---------- Font ---------- */
@font-face {
  font-family: 'Space Grotesk';
  src: url(data:font/woff2;base64,__FONT_B64__) format('woff2');
  font-weight: 300 700;
  font-style: normal;
}

/* ---------- Tokens ---------- */
:root {
  --lime: #cadb2b;
  --ink: #1a1a1a;
  --white: #ffffff;
  --gray-100: #f4f4f1;
  --gray-300: #dcdcd8;
  --gray-500: #8c8c87;
  --gray-700: #4c4c48;
  --font: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
}

body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--gray-500);
  -webkit-font-smoothing: antialiased;
}

/* ---------- Print scale ---------- */
.p-display { font-size: 58px; font-weight: 700; line-height: 1.04; letter-spacing: -0.02em; }
.p-h1 { font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.p-h2 { font-size: 20px; font-weight: 600; line-height: 1.2; }
.p-h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
.p-body { font-size: 13.5px; font-weight: 400; line-height: 1.55; }
.p-small { font-size: 11.5px; font-weight: 400; line-height: 1.5; }
.p-label { font-size: 10px; font-weight: 500; line-height: 1.3; letter-spacing: 0.04em; text-transform: uppercase; }

/* ---------- Logo colour classes ----------
   Paths are drawn once in <symbol> and reused via <use>. Chrome's
   generated shadow tree for <use> does NOT match descendant selectors
   reaching in from outside (e.g. ".logo-svg .ink" or ".on-dark .logo-svg
   .ink" never match), so colours must be set with bare class selectors
   (class presence still matches on cloned nodes) plus inheritable CSS
   custom properties (which DO cross the shadow boundary) for switching. */
.ink { fill: var(--ink-fill, var(--ink)); }
.lime { fill: var(--lime); }
.accent-white { fill: var(--white); }
.on-dark { --ink-fill: var(--white); }
.on-lime { --ink-fill: var(--ink); }

/* ---------- Readouts / bracket frame (precision system) ---------- */
.readout { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray-700); }
.on-dark-ctx .readout { color: var(--lime); }

.bracket-frame {
  position: relative;
  background-repeat: no-repeat;
  background-image:
    linear-gradient(to right, var(--lime) 2px, transparent 2px),
    linear-gradient(to bottom, var(--lime) 2px, transparent 2px),
    linear-gradient(to left, var(--lime) 2px, transparent 2px),
    linear-gradient(to bottom, var(--lime) 2px, transparent 2px),
    linear-gradient(to right, var(--lime) 2px, transparent 2px),
    linear-gradient(to top, var(--lime) 2px, transparent 2px),
    linear-gradient(to left, var(--lime) 2px, transparent 2px),
    linear-gradient(to top, var(--lime) 2px, transparent 2px);
  background-size: 22px 2px, 2px 22px, 22px 2px, 2px 22px, 22px 2px, 2px 22px, 22px 2px, 2px 22px;
  background-position: top left, top left, top right, top right, bottom left, bottom left, bottom right, bottom right;
}

/* ---------- Page shell ---------- */
@page { size: 297mm 210mm; margin: 0; }
.page {
  width: 297mm;
  height: 210mm;
  position: relative;
  overflow: hidden;
  background: var(--white);
  color: var(--ink);
  page-break-after: always;
  break-after: page;
  display: flex;
  flex-direction: column;
}
.page:last-of-type { page-break-after: auto; }
.page-dark { background: var(--ink); color: var(--white); }
.page-tint { background: var(--gray-100); color: var(--ink); }

.page-pad { flex: 1; padding: 15mm 16mm 12mm; display: flex; flex-direction: column; min-height: 0; }
.page-pad-flush { flex: 1; padding: 0; display: flex; flex-direction: column; min-height: 0; }

/* header / footer furniture */
.pf-header { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 9px; margin-bottom: 16px; border-bottom: 1px solid var(--gray-300); }
.page-dark .pf-header, .page-dark .pf-footer { border-color: rgba(255,255,255,0.18); }
.pf-header .readout { display: flex; align-items: center; gap: 7px; }
.pf-header .readout::before { content: ""; width: 6px; height: 6px; background: var(--lime); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); display: inline-block; }
.pf-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 16mm 12px; border-top: 1px solid var(--gray-300); }
.pf-footer .logo-svg { width: 15px; }
.pf-foot-left { display: flex; align-items: center; gap: 9px; }

.pg-eyebrow { color: var(--gray-700); }
.page-dark .pg-eyebrow, .on-dark-ctx .pg-eyebrow { color: var(--lime); }

/* ---------- Chamfered components ---------- */
.tile {
  position: relative;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  display: flex;
  align-items: center;
  justify-content: center;
}
.tile-light { background: var(--gray-100); }
.tile-dark { background: var(--ink); }
.tile-lime { background: var(--lime); }
.tile-fig {
  position: absolute; top: 10px; left: 12px;
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gray-500);
}
.tile-dark .tile-fig { color: rgba(255,255,255,0.55); }
.tile-lime .tile-fig { color: rgba(26,26,26,0.55); }

.chip {
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  background: var(--gray-100);
  padding: 12px 16px;
  position: relative;
}
.chip-lead { border-left: 3px solid var(--lime); }

.subhead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.subhead .p-body { color: var(--gray-700); max-width: 420px; }
.page-dark .subhead .p-body { color: var(--gray-300); }

/* ---------- Section index watermark ---------- */
.idx-mark {
  position: absolute;
  font-family: var(--mono);
  font-weight: 500;
  font-size: 220px;
  line-height: 1;
  color: var(--gray-300);
  opacity: 0.5;
  right: 6mm;
  bottom: -18mm;
  z-index: 0;
  letter-spacing: -0.04em;
  pointer-events: none;
}
.page-dark .idx-mark { color: rgba(255,255,255,0.06); opacity: 1; }
.page-tint .idx-mark { color: rgba(26,26,26,0.05); opacity: 1; }
.page-content { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

/* ==================================================================
   COVER
   ================================================================== */
.cover {
  background: var(--ink);
  color: var(--white);
  position: relative;
}
.cover-wedge {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 42%;
  background: var(--lime);
  clip-path: polygon(34% 0, 100% 0, 100% 100%, 2% 100%);
}
.cover-inner { position: relative; z-index: 2; padding: 20mm 22mm; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.cover-tag { color: var(--lime); margin-bottom: auto; }
.cover-mark-wrap { width: 300px; }
.cover-logo-frame { padding: 20px; }
.cover-scale { display: flex; align-items: center; gap: 10px; margin-top: 14px; width: 300px; }
.cover-scale-line { flex: 1; height: 1px; background: var(--lime); opacity: 0.6; position: relative; }
.cover-scale-line::before, .cover-scale-line::after { content:""; position:absolute; top:-4px; width:1px; height:9px; background: var(--lime); }
.cover-scale-line::before { left:0; } .cover-scale-line::after { right:0; }
.cover-title { margin-top: 26px; }
.cover-meta { display: flex; gap: 36px; margin-top: 20px; }
.cover-meta .p-label { color: var(--lime); display: block; margin-bottom: 4px; }
.cover-meta .p-body { color: var(--gray-300); }

/* ==================================================================
   TOC
   ================================================================== */
.toc-list { margin-top: 6px; }
.toc-row { display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--gray-300); }
.toc-num { font-family: var(--mono); font-size: 12px; color: var(--lime); background: var(--ink); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toc-title { font-size: 17px; font-weight: 600; white-space: nowrap; }
.toc-desc { color: var(--gray-700); font-size: 11.5px; white-space: nowrap; }
.toc-leader { flex: 1; border-bottom: 1px dotted var(--gray-500); margin: 0 4px; transform: translateY(-4px); min-width: 20px; }
.toc-page { font-family: var(--mono); font-size: 12px; color: var(--gray-700); white-space: nowrap; }

/* ==================================================================
   Grids
   ================================================================== */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }

/* ==================================================================
   Overview page
   ================================================================== */
.ov-col h3 { margin-bottom: 8px; }
.ov-col p { margin-top: 8px; color: var(--gray-300); }
.ov-photo { overflow: hidden; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%); }
.ov-photo img { width: 100%; height: 100%; object-fit: cover; }
.ov-caption { color: var(--gray-300); margin-top: 8px; }

/* ==================================================================
   Personality
   ================================================================== */
.pill-row { display: flex; flex-wrap: wrap; gap: 12px; }
.pill { background: var(--lime); color: var(--ink); padding: 13px 22px; border-radius: 999px; font-weight: 500; font-size: 16px; }

/* ==================================================================
   Logo tiles specifics
   ================================================================== */
.logo-tile-full .logo-svg { width: 100%; max-width: 320px; }
.logo-tile-mark .logo-svg { max-width: 76px; }
.clearspace-card { background: var(--gray-100); clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); padding: 14px 18px; display: flex; align-items: center; justify-content: center; position: relative; }
.clearspace-card img { max-height: 100%; width: auto; max-width: 100%; }
.dont-card { background: var(--white); clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); padding: 12px 8px; text-align: center; }
.dont-mark { width: 26px; height: 26px; margin: 0 auto 8px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: var(--ink); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 11px; }

/* ==================================================================
   Colour swatches
   ================================================================== */
.sw-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.sw { clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); padding: 22px 26px; display: flex; flex-direction: column; justify-content: space-between; min-height: 190px; }
.sw-lime { background: var(--lime); color: var(--ink); }
.sw-ink { background: var(--ink); color: var(--white); }
.sw-ink .readout { color: rgba(255,255,255,0.6); }
.sw-white { background: var(--white); color: var(--ink); border: 1px solid var(--gray-300); }
.sw-index { display: block; margin-bottom: 6px; }
.sw-name { margin-bottom: 10px; }
.sw-spec-row { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.sw-spec-row .spec { display: flex; justify-content: space-between; }
.sw-spec-row .p-label { opacity: 0.65; }

/* ==================================================================
   Type pages
   ================================================================== */
.font-specimen { background: var(--ink); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); padding: 26px; display: flex; align-items: center; justify-content: center; }
.font-specimen .logo-svg { width: min(320px, 90%); }
.weight-list { border-top: 1px solid var(--gray-300); margin-top: 14px; }
.weight-row { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--gray-300); gap: 16px; }
.weight-row .sample { font-size: 20px; }
.w300{font-weight:300;} .w400{font-weight:400;} .w500{font-weight:500;} .w600{font-weight:600;} .w700{font-weight:700;}
.weight-row .p-label { color: var(--gray-500); white-space: nowrap; }
.alphabet { margin-top: 12px; color: var(--gray-700); font-size: 13px; line-height: 1.6; }

.scale-row { padding: 9px 0; border-bottom: 1px solid var(--gray-300); display: flex; align-items: baseline; gap: 14px; }
.scale-row:last-child { border-bottom: none; }
.scale-tag { width: 78px; flex-shrink: 0; }
.scale-tag .p-label { color: var(--gray-500); display: block; }
.scale-tag .spec { font-size: 9.5px; color: var(--gray-500); font-family: var(--mono); }
.scale-sample { color: var(--ink); flex: 1; min-width: 0; }

/* ==================================================================
   Voice
   ================================================================== */
.voice-col { background: var(--gray-100); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); padding: 22px; border-top: 4px solid var(--lime); }
.voice-col.dont { border-top-color: var(--ink); }
.voice-col h3 { margin-bottom: 12px; }
.voice-col ul { display: flex; flex-direction: column; gap: 10px; }
.voice-col li { color: var(--gray-700); padding-left: 16px; position: relative; font-size: 12.5px; line-height: 1.5; }
.voice-col li::before { content:""; position:absolute; left:0; top:7px; width:5px; height:5px; background: var(--lime); border-radius:50%; }
.voice-col.dont li::before { background: var(--ink); }

/* ==================================================================
   Mockup / in use
   ================================================================== */
.mockup { background: var(--ink); clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.mockup .logo-svg { width: 130px; }
.mockup-links { display: flex; gap: 22px; }
.mockup-links span { color: var(--gray-300); font-size: 13px; font-weight: 500; }
.mockup-cta { background: var(--lime); color: var(--ink); padding: 9px 18px; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); font-weight: 500; font-size: 13px; }
.mockup-caption { color: var(--gray-700); margin-top: 14px; }

/* ==================================================================
   Downloads / asset reference
   ================================================================== */
.dl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.dl-card { background: var(--gray-100); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 300px; }
.dl-card .p-h3 { margin: 0; }
.dl-card .p-small { color: var(--gray-700); flex-grow: 1; }
.dl-meta { color: var(--gray-500); }
.dl-file { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--gray-300); font-family: var(--mono); font-size: 10.5px; color: var(--ink); word-break: break-all; }

/* ==================================================================
   Back cover
   ================================================================== */
.back-cover { background: var(--ink); color: var(--white); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; }
.back-mark { width: 90px; }
</style>
</head>
